worker_processes auto;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 20M;

    # --- Gzip ---
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml
    application/font-woff2
    font/woff2;

    # --- WebSocket upgrade ---
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # --- Upstream ---
    upstream app {
        server app:3000;
        keepalive 16;
    }

    # --- HTTP → HTTPS redirect ---
    server {
        listen 80;
        server_name localhost 127.0.0.1 chamada.local;
        return 301 https://$host$request_uri;
    }

    # --- HTTPS ---
    server {
        listen 443 ssl;
        http2 on;
        server_name localhost 127.0.0.1 chamada.local;

        # Certificados
        ssl_certificate /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        # Protocolos e cifras
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;

        # Session cache
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # OCSP Stapling (opcional, requer CA chain)
        # ssl_stapling on;
        # ssl_stapling_verify on;
        # ssl_trusted_certificate /etc/nginx/certs/chain.pem;

        # --- Security headers ---
        # HSTS removido — não compatível com localhost/IP/domínio local
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # --- Assets estáticos (cache longo, sem overhead de WebSocket) ---
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # --- Aplicação + WebSocket ---
        location / {
            proxy_pass http://app;
            proxy_http_version 1.1;

            # WebSocket
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Headers de proxy
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts — read alto para suportar WebSocket de longa duração
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 3600s;
        }
    }
}
