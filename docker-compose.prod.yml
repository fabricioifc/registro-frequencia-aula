services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: registro-frequencia-app
    expose:
      - 3000
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - prod-network
    restart: always
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  nginx:
    image: nginx:alpine
    container_name: registro-frequencia-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app
    networks:
      - prod-network
    restart: always

networks:
  prod-network:
    driver: bridge
